    </button>
    <div class="collapse navbar-collapse flex-grow-0" id="navbarNav">

            <li class="nav-item">
                <form action="{% url 'common:logout' %}" method="post" style="display:inline;">

                </form>
            </li>
            {% else %}
            <li class="nav-item">
